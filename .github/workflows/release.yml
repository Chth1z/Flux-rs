name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  freeze:
    name: require freeze list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ndk_revision: ${{ steps.read.outputs.ndk_revision }}
      bpftool_tag: ${{ steps.read.outputs.bpftool_tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # 2026-09-17
      - id: read
        name: Read freeze sidecars
        run: |
          set -eu
          test -f dist/freeze/manifest.toml
          test -f dist/freeze/Cargo.lock
          test -f dist/freeze/ndk-revision
          test -f dist/freeze/bpftool-tag
          {
            printf 'ndk_revision=%s\n' "$(tr -d '\r\n' < dist/freeze/ndk-revision)"
            printf 'bpftool_tag=%s\n' "$(tr -d '\r\n' < dist/freeze/bpftool-tag)"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: freeze
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ndk_revision: ${{ needs.freeze.outputs.ndk_revision }}
      bpftool_tag: ${{ needs.freeze.outputs.bpftool_tag }}

  publish:
    name: signed tag / reproducible release
    needs: [verify, freeze]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # 2026-09-17
        with:
          fetch-depth: 0

      # A lightweight or unsigned annotated tag is not a release authority.
      # GitHub's tag-object verification handles both GPG and SSH signatures.
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object')
          object_type=$(printf '%s' "$tag_object" | jq -r '.type')
          object_sha=$(printf '%s' "$tag_object" | jq -r '.sha')
          test "$object_type" = tag || {
            echo "release tag must be annotated and signed"; exit 1;
          }
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.verification.verified')
          test "$verified" = true || {
            echo "GitHub did not verify the release-tag signature"; exit 1;
          }

      - name: Set up NDK from freeze list
        id: setup-ndk
        env:
          FLUX_NDK_REVISION: ${{ needs.freeze.outputs.ndk_revision }}
        run: sh tools/ci/setup-ndk.sh

      - name: Install BPF build inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm /usr/include/asm

      - name: Build release and Corresponding Source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Flux-rs-"$GITHUB_REF_NAME"-arm64.zip \
            dist/SHA256SUMS \
            dist/sing-box-v*-source.tar.gz \
            --verify-tag \
            --generate-notes \
            --title "Flux-rs $GITHUB_REF_NAME"
