name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain, including its components and the aarch64-linux-android
      # target, is pinned by rust-toolchain.toml.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  bpf:
    name: bpf object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - uses: Swatinem/rust-cache@v2

      # Proves bpf/flux.bpf.c still compiles for the bpf target. The loader
      # itself is exercised on-device, not here.
      - name: Compile data plane
        env:
          FLUX_BUILD_BPF: "1"
        run: cargo build -p fluxd

      # flux_abi.h is the sole source of truth; flux-core/src/abi.rs mirrors it
      # by hand. This compares clang's offsets against the Rust mirror so the
      # two can never drift silently.
      - name: ABI offset cross-check
        run: cargo xtask abi-check
        # Implement in stage 1 and delete this line then; the stage does not
        # exit until abi-check is real and green. See
        # docs/plan/implementation.md section 17.4.
        continue-on-error: true

      - name: Install bpftool
        run: sudo apt-get install -y linux-tools-common linux-tools-generic

      # The cheapest gate the project has, and it has already earned its place:
      # the run that first exercised it found that every program carried an ELF
      # section name libbpf refuses (SEC("tc/cap_l2") and friends), so not one
      # of them could be loaded at all. Compiling had not noticed, because
      # compiling never does. See docs/verification/phase0.md section 16.8.
      #
      # bpftool builds maps from the BTF declarations, whereas fluxd builds them
      # explicitly in maps.rs (blueprint 12.2). So a pass here means the PROGRAM
      # LOGIC verifies, not that the map parameters are right -- and the runner's
      # kernel is x86_64 and newer than the arm64 5.15 baseline, so this
      # supplements on-device verification rather than replacing it. A verifier
      # rejection here is still real and worth failing the build over.
      - name: Verifier gate
        run: |
          set -eu
          obj=$(find target -name 'flux.bpf.o' -print -quit)
          if [ -z "$obj" ]; then
            echo "flux.bpf.o not produced by the build step above"; exit 1
          fi
          echo "object: $obj"
          sudo bpftool prog loadall "$obj" /sys/fs/bpf/fluxci
          echo "--- loaded:"
          sudo bpftool prog show pinned /sys/fs/bpf/fluxci/flx_cap_l2
          sudo bpftool prog show pinned /sys/fs/bpf/fluxci/flx_cap_l3
          sudo bpftool prog show pinned /sys/fs/bpf/fluxci/flx_in
          sudo bpftool prog show pinned /sys/fs/bpf/fluxci/flx_verify
          sudo rm -rf /sys/fs/bpf/fluxci

  android:
    name: aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Cross build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          cargo build --workspace --target aarch64-linux-android

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # Module scripts run under BusyBox ash, so target sh, not bash.
          shellcheck --shell=sh --severity=warning module/*.sh
