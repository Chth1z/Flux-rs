[package]
name = "fluxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Flux-rs runtime: eBPF loader, network objects, reactor and engine supervisor."

[[bin]]
name = "fluxd"
path = "src/main.rs"

# harness = false: each test binary doubles as the fake engine when spawned
# with sing-box argv (`run -c …`), which a libtest harness would misparse as
# filter options. Their own main() runs the scenarios sequentially.
[[test]]
name = "engine_lifecycle"
harness = false

[[test]]
name = "daemon_e2e"
harness = false

[[test]]
name = "phase3_device"
harness = false

[dependencies]
flux-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# target_os on Android is "android", NOT "linux" — the daemon must build for
# both (the product ships on Android; Linux hosts run the tests).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = { workspace = true }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
