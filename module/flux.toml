# ==============================================================================
#                            Flux-rs 配置
# ==============================================================================
# 位置：/data/adb/flux-rs/config/flux.toml
# 生效：运行中的 Flux 会在保存后自动验证并应用；`fluxd check` 用于诊断。
#
# 严格模式：只接受已定义的配置项。未知键、重复项、非 canonical CIDR
# 与超限内容都会使整份候选配置被拒绝；Flux 不会截断或部分应用。
#
# 开关不在本文件里。唯一开关就是你 root 管理器里的模块开关，
# 拨动后当场生效，不需要重启。等价命令：fluxd enable / fluxd disable
# 首次安装后为停用状态，填好配置后启用并重启一次。
# Flux 用可用节点生成完整配置并验证后激活；check 用于诊断。
# 当前状态直接显示在管理器的模块描述里。
# ==============================================================================

[apps]
# whitelist：只代理清单里的应用；blacklist：代理清单之外的所有应用。
# 格式为 "userId:packageName"；单用户设备 userId 为 0，可省略 `0:`。
# `@apps.txt` 会读取同目录列表文件；每行一项，`#` 开头为注释。
mode = "blacklist"
list = []

[cidr]
# blacklist：清单里的目标地址直连；whitelist：只捕获清单里的目标地址。
# 此处只认 canonical CIDR，不处理域名；IPv4 与 IPv6 可以写在一起。
mode = "blacklist"
list = []

[interfaces]
# blacklist 且空清单表示自动接管所有受支持的物理上游接口。
mode = "blacklist"
list = []

[ssid]
# 名字须与手机 Wi-Fi 设置里显示的名字逐字相同；没连 Wi-Fi 时此表不起作用。
mode = "blacklist"
list = []

[nodes]
# 订阅 URL、手工节点 URI、@本地文件可混合填写，按顺序合并。
# 例如 sources = ["https://provider.example.invalid/sub", "@nodes.txt"]
# 本地文件每行一条手工节点 URI；只有整行以 # 开头才是注释。
# HTTP(S) 字符串表示订阅；手工 HTTP 代理使用 { node = "http://..." }。
# 手工节点名保持原样。抓取、清洗、分组与日志策略见 advanced.toml。
sources = []
