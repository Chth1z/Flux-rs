# ==============================================================================
#                            Flux-rs 配置
# ==============================================================================
# 位置：/data/adb/flux-rs/flux.toml
# 生效：改完执行 `fluxd reload`，不需要重启
# 校验：`fluxd check` 只校验不改状态，建议改完先跑一次
#
# 严格模式：未知的键会被拒绝并提示最接近的合法键名。
# 拼错一个字段而静默失效是最糟的失败，所以这里不容忍未知键。
#
# 开关不在本文件里。开关是 /data/adb/flux-rs/disable 这个文件：
#   停用： touch /data/adb/flux-rs/disable
#   启用： rm    /data/adb/flux-rs/disable
# 两处都能改的开关必然会分叉，所以只保留一处。
# ==============================================================================


# ==============================================================================
# [ 应用选择 ]
# ==============================================================================
[apps]

# 选择方式。三者只能用一种。
#   "list"       只代理 selected 里列出的应用
#   "all"        代理全部第三方应用，除 excluded 里列出的
#   "none"       不代理任何应用（数据面仍会加载，用于确认环境正常）
mode = "list"

# mode = "list" 时使用。格式 "userId:packageName"。
# userId 是 Android 多用户 ID，单用户设备恒为 0，可以省略前缀直接写包名。
#
# 注意共享 UID：若某应用与其它应用共享同一个 UID，选中它会
# 连带捕获同 UID 的全部应用。`fluxd check` 会把连带的列出来。
selected = [
    "0:com.android.chrome",
    "com.example.app",          # 省略 userId 等价于 "0:com.example.app"
]

# mode = "all" 时使用。除这些之外的第三方应用全部代理。
excluded = [
    "com.tencent.mm",
]

# 是否包含系统应用（app id 在 10000 以下）。
#
# 保持 false。系统应用的流量归属复杂，且选中某些系统进程会导致设备失联。
# 即使设为 true，app id 也被硬性限制在 [10000, 19999]，
# 结构上无法选中 root 或 system_server。
include_system = false


# ==============================================================================
# [ 直连（bypass） ]
# ==============================================================================
# 命中这里的目的地址**不会被捕获**，直接走系统原路。
#
# 重要：bypass 的判定在 sing-box 之前，且是终局的。
# 如果某个域名解析到了被 bypass 的地址，即使你在 sing-box 里
# 为它写了走代理的规则，也不会生效——因为那些包根本没进代理。
# ==============================================================================
[bypass]

# 额外直连的目的网段。
#
# 以下已经无条件直连，不需要在这里重复：
#   回环、链路本地、多播、广播、RFC1918 私有地址、
#   listener 保留段（198.18.0.0/15、2001:db8::/32）、
#   以及本机自己配置的全部地址（由 rtnetlink 动态维护）
v4 = []
v6 = []

# 从文件加载大规模网段列表。每行一条 CIDR，`#` 起始为注释。
# 相对路径以本文件所在目录为基准。
#
# 典型用途：境内地址直连。这不只是省流量——命中的包
# 完全不进代理，省掉一次跨设备回送、一次用户态拷贝、
# 和一条额外的 TCP 连接。万条量级的列表在内核里是常规负载。
#
# 上限 65536 条（v4 与 v6 各自独立计算）。
# files = ["cidr/chnroute.txt", "cidr/chnroute6.txt"]
files = []


# ==============================================================================
# [ 网络接口 ]
# ==============================================================================
[interfaces]

# 接口选择方式。
#   "auto"    自动接管全部受支持的物理接口（推荐）
#   "list"    只接管 include 里列出的
#
# auto 的判定依据是**链路类型**而不是名字：以太（Wi-Fi 等）与
# raw-IP（蜂窝）都受支持，VPN tun、桥接、未知类型一律排除。
# 不按名字匹配是有意的——各家 SoC 的蜂窝接口命名不同
# （高通 rmnet_data*、联发科 ccmni*），按名字写死会在别家出错。
mode = "auto"

# mode = "list" 时使用，写接口名。
include = []

# 明确排除的接口，auto 模式下也生效。
# 例：只想代理 Wi-Fi 不想代理蜂窝，就把蜂窝接口写在这里。
exclude = []


# ==============================================================================
# [ 订阅 ]
# ==============================================================================
# 订阅只影响 sing-box.json，不影响上面的应用选择。
# 手动更新：`fluxd subscribe`
# ==============================================================================
[subscription]

# 订阅链接。留空则不启用订阅功能。
# 支持两种内容：base64 编码的 URI 列表，或已经是 sing-box 格式的 JSON。
url = ""

# 自动更新间隔（秒）。0 表示只手动更新。
# 86400 = 24 小时。
interval = 86400

# 单次下载超时（秒）与重试次数。
timeout = 10
retries = 2

# 节点名里命中这个正则的条目会被丢弃。
#
# 机场普遍把公告塞进节点列表当成假节点（"剩余流量:xxGB"、
# "到期时间:2026-xx-xx"、"官网地址" 之类）。这些条目连不上，
# 混在服务器列表里只会碍事。下面的默认值覆盖了常见情况。
exclude_pattern = "(expire|traffic|官网|到期|流量|剩余|套餐|重置|联系|群组|通知|平台|网站|时间|建议|反馈|版本|更新)"

# 节点名重写规则，按顺序应用。
rename = [
    { match = "【(亚洲|北美洲|欧洲|南美洲|非洲|大洋洲|南极洲)】", replace = "" },
    { match = "【", replace = "[" },
    { match = "】", replace = "]" },
]

# 是否从节点名里剥掉 emoji（国旗与杂项符号）。
strip_emoji = true

# 节点名最大长度，超出则截断并加省略号。
max_tag_length = 32


# ==============================================================================
# [ 日志 ]
# ==============================================================================
[log]

# error | warn | info | debug
level = "info"

# 单个日志文件轮转阈值（字节）与保留份数。
max_size = 1048576
keep = 3


# ==============================================================================
# [ 高级 ]
# ==============================================================================
# 以下项通常不需要改。改之前建议先读 docs/blueprint.md 里对应的章节。
# ==============================================================================
[advanced]

# 统计每个应用经代理走了多少流量。
#
# 只在被捕获的包上计数，未选中的流量完全不受影响。
# 只记字节数与包数，**不记目的地址、不记端口、不记时间序列**——
# 不保存任何能重建访问历史的东西。
per_app_stats = true

# 激活时的存活验证窗口（秒）。
#
# 装上 TC 程序之后，我们会先确认它真的收到了数据包，才开始接管流量。
# 这是必需的：某些手机厂商的程序会占据更靠前的位置并终止处理链，
# 此时我们的程序装得上、但一个包也收不到，而系统不会报任何错。
# 窗口内没有流量则退避重试，不会因为你当时没上网就拒绝启动。
verify_window = 2

# 网络变化后重新收敛前的等待时间（毫秒）。
#
# Android 的接口变化是成串到达的（Wi-Fi 重连、蜂窝切换），
# 等一小会儿再动可以避免抖动期间反复装卸。
debounce_ms = 500
