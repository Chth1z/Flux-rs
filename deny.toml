[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []
unused-ignored-advisory = "deny"

# Every allowance below must be exercised by an actual dependency
# (unused-allowed-license = "deny"), so this list IS the license inventory of
# the tree. Extend it only together with the dependency that needs it.
[licenses]
allow = [
  "Apache-2.0",
  "GPL-3.0-only",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
exceptions = []

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
