[workspace]
members = ["crates/flux-core", "crates/fluxd", "xtask"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Chth1z/Flux-rs"

[workspace.dependencies]
toml_edit = "*"
flux-core = { path = "crates/flux-core" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["preserve_order"] }
toml = "*"
libc = "*"
# `rustls-no-provider` rather than `rustls`: the latter also bundles
# webpki-roots, a Mozilla root store Flux never consults — it reads the
# device's own certificate directories and refuses to fall back (§28.3). The
# crypto provider ureq would otherwise pick implicitly is named explicitly below.
ureq = { version = "*", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "*", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "*"
url = "*"
regex-lite = "*"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
